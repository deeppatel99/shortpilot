# ShortPilot in the cloud: no PC needed. See docs/CLOUD.md.
#   - scout time (channel.json schedule.scout_at): Cloudflare Worker cron -> repository_dispatch "cron" -> trends,
#     script -> Telegram -> (auto mode: render -> booked for the publish slot)
#   - 3 minutes after each publish slot: Worker cron -> publishes that slot (YouTube already went public via
#     publishAt, so the comment can be posted; Instagram + Facebook Reels are posted now)
#   - every Telegram button / message: Cloudflare Worker -> repository_dispatch "telegram" -> this workflow
# Cron times live in pipeline/cloud_setup.py (UTC). This is the only copy of the workflow - edit it here.
# GitHub's own schedule is not used: it ran late or skipped runs.
name: ShortPilot bot

on:
  repository_dispatch:
    types: [telegram, cron]
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        required: true
        default: status
        type: choice
        options: [status, daily, publish]

permissions:
  contents: write            # state branch + render releases

concurrency:                 # one run at a time, the rest wait in line (never cancelled)
  group: autopilot-bot
  cancel-in-progress: false
  queue: max

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      PYTHONUTF8: "1"
      AUTOPILOT_DATA: ${{ github.workspace }}/state/data
      AUTOPILOT_EPISODES: ${{ github.workspace }}/state/episodes
      MEDIA_CACHE: /tmp/autopilot_media
      AUTOPILOT_CHANNEL: ${{ vars.AUTOPILOT_CHANNEL }}  # which channels/<slug>/ this repo runs (set by cloud-setup)
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
      GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: What does this run need?
        id: need
        run: python3 cloud/classify.py >> "$GITHUB_OUTPUT"

      - name: Load state branch
        run: |
          git config --global user.name "autopilot-bot"
          git config --global user.email "autopilot-bot@users.noreply.github.com"
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$URL" state >/dev/null 2>&1; then
            git clone -q --depth 1 --branch state "$URL" state
          else
            mkdir -p state && cd state && git init -q -b state && git remote add origin "$URL"
            printf "data/videos/\ndata/logs/\ndata/bin/\ndata/llm_sandbox/\ndata/media_cache/\n*.tmp\n" > .gitignore
          fi
          mkdir -p "$AUTOPILOT_DATA" "$AUTOPILOT_EPISODES"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Python packages
        run: pip install -q -r requirements.txt

      - name: FFmpeg
        if: steps.need.outputs.render == 'true'
        timeout-minutes: 8
        run: |
          # Static build from GitHub (seconds). apt only as a time-boxed fallback: its mirrors sometimes hang 10+ min.
          D="$HOME/ffmpeg"; mkdir -p "$D"
          if curl -sSfL --retry 3 --max-time 180 \
               https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
             | tar xJ -C "$D" --strip-components=1 && "$D/bin/ffmpeg" -version >/dev/null; then
            echo "$D/bin" >> "$GITHUB_PATH"; "$D/bin/ffmpeg" -version | head -1
          else
            sudo timeout 120 apt-get update -qq; sudo timeout 240 apt-get install -y -qq ffmpeg >/dev/null
            ffmpeg -version | head -1
          fi

      - name: Chromium cache (HTML video renderer)
        if: steps.need.outputs.render == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.55

      - name: Chromium
        if: steps.need.outputs.render == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Voice model cache
        if: steps.need.outputs.render == 'true'
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: Voice model
        if: steps.need.outputs.render == 'true'
        run: |
          mkdir -p models && cd models
          B=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -s kokoro-v1.0.onnx ] || curl -sSfL -o kokoro-v1.0.onnx $B/kokoro-v1.0.onnx
          [ -s voices-v1.0.bin ] || curl -sSfL -o voices-v1.0.bin $B/voices-v1.0.bin
          ls -la

      - uses: actions/setup-node@v4
        if: steps.need.outputs.llm == 'true'
        with:
          node-version: "22"

      - name: Claude Code (uses your Pro plan via CLAUDE_CODE_OAUTH_TOKEN)
        if: steps.need.outputs.llm == 'true'
        run: npm install -g --silent @anthropic-ai/claude-code && claude --version

      - name: Run the bot
        run: python autopilot.py cloud

      - name: Save state
        if: always()
        run: |
          cd state
          git add -A
          git diff --cached --quiet || git commit -qm "state: ${GITHUB_EVENT_NAME} #${GITHUB_RUN_NUMBER}"
          for i in 1 2 3 4; do git push -q origin HEAD:state && break; git pull -q --rebase origin state || true; sleep 4; done

      - name: Logs (only when something failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: state/data/logs
          retention-days: 7
