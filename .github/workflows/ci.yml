# Lint + the offline test suite on every push and pull request. No secrets needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.55
      - run: python -m playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0
      - name: Voice model
        run: |
          mkdir -p models && cd models
          B=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -s kokoro-v1.0.onnx ] || curl -sSfL -o kokoro-v1.0.onnx $B/kokoro-v1.0.onnx
          [ -s voices-v1.0.bin ] || curl -sSfL -o voices-v1.0.bin $B/voices-v1.0.bin
      - name: Demo render (no keys)
        run: python autopilot.py demo
      - name: Tests
        run: for t in tests/test_*.py; do echo "::group::$t"; python "$t"; echo "::endgroup::"; done
      - name: Fuzz the renderer
        run: python tests/fuzz_render.py 2   # ~4 min per render on a free runner; run the full 6 locally
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-video
          path: channels/_template/data/videos/demo.mp4
          if-no-files-found: ignore
