name: Bug report
description: Something broke or behaves wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "⚠️ Never paste keys, tokens or the contents of `.env`."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output / logs
      description: The command output, `python autopilot.py check`, or `data/logs/render_<id>.log` (remove anything private).
      render: text
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [PC (serve / make), Cloud (GitHub Actions), Not sure]
  - type: input
    id: env
    attributes:
      label: OS, Python version, channel language
      placeholder: "Ubuntu 24.04, Python 3.12, es-MX"
